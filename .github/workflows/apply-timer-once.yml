name: Apply Julo timer feature once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-timer-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Apply timer migration
        run: node .github/timer-codemod.mjs

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Audit dependencies
        working-directory: webapp
        run: npm audit --audit-level=high

      - name: Run source security checks
        working-directory: webapp
        run: npm run security:check

      - name: Run tests
        working-directory: webapp
        run: npm test

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      - name: Commit timer feature
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- webapp .github/timer-codemod.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat(web): add exclusive task timers"
          git push origin HEAD:main
