name: Bootstrap Julo baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-baseline.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Julo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source tree from Planer baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/planer
          git clone --depth 1 https://github.com/vovain/Planer.git /tmp/planer
          rm -f src
          rm -rf src
          cp -R /tmp/planer/src ./src
          rm -f Julo-main.zip

      - name: Commit restored baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Baseline already restored"
            exit 0
          fi
          git commit -m "chore: restore Julo source baseline"
          git push origin HEAD:main
