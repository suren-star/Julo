name: Extract desktop localization catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-localization-catalog.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - name: Extract Russian user-facing strings
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Comment
          import re, json
          CYR=re.compile(r'[А-Яа-яЁё]')
          entries={}
          def add(text,loc,kind):
              text=text.strip()
              if not text or not CYR.search(text): return
              item=entries.setdefault(text,{'text':text,'locations':[],'kind':kind})
              if loc not in item['locations']: item['locations'].append(loc)

          html=Path('desktop/src/index.html')
          soup=BeautifulSoup(html.read_text(encoding='utf-8'),'html.parser')
          for node in soup.find_all(string=True):
              if isinstance(node,Comment) or (node.parent and node.parent.name in {'script','style'}): continue
              add(str(node), 'desktop/src/index.html', 'html-text')
          for tag in soup.find_all(True):
              for attr in ('title','placeholder','aria-label','data-tooltip'):
                  val=tag.attrs.get(attr)
                  if isinstance(val,str): add(val,f'desktop/src/index.html@{attr}','html-attr')

          def scan(text):
              i=0;n=len(text)
              while i<n:
                  if text.startswith('//',i):
                      j=text.find('\n',i+2);i=n if j<0 else j+1;continue
                  if text.startswith('/*',i):
                      j=text.find('*/',i+2);i=n if j<0 else j+2;continue
                  ch=text[i]
                  if ch not in ('\"',"'",'`'): i+=1;continue
                  q=ch;s=i;i+=1;esc=False
                  while i<n:
                      c=text[i]
                      if esc: esc=False;i+=1;continue
                      if c=='\\': esc=True;i+=1;continue
                      if c==q:
                          yield text[s+1:i]
                          i+=1;break
                      i+=1
                  else: break

          for path in [Path('desktop/main.js'),Path('desktop/preload.js'),Path('desktop/src/js/app.js'),Path('desktop/src/js/storage.js'),Path('desktop/src/js/sync.js'),Path('desktop/src/js/timer.js')]:
              text=path.read_text(encoding='utf-8')
              for raw in scan(text): add(raw,str(path),'js-string')

          catalog=sorted(entries.values(),key=lambda x:(x['kind'],x['text']))
          Path('localization-catalog.json').write_text(json.dumps({'count':len(catalog),'entries':catalog},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'catalog count={len(catalog)}')
          PY
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f localization-catalog.json
          git commit -m "chore: capture desktop localization catalog"
          git push origin HEAD:main
