name: Restructure Julo platforms v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restructure-platform-v2.yml'

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import latest desktop baseline
        run: |
          set -euo pipefail
          git fetch origin beta-dev
          rm -rf main.js preload.js package.json package-lock.json run.bat src lib tests .gitignore README.md desktop webapp
          mkdir -p desktop
          git archive origin/beta-dev main.js preload.js package.json package-lock.json run.bat src lib tests .gitignore | tar -x -C desktop

      - name: Recreate platform files from reviewed bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap, json

          source = Path('.github/workflows/restructure-platform.yml').read_text(encoding='utf-8')
          pattern = re.compile(r"^[ \t]+cat > ([^ ]+) <<'EOF'\n(.*?)^[ \t]+EOF\s*$", re.M | re.S)
          written=[]
          for match in pattern.finditer(source):
              raw_path=match.group(1)
              if raw_path not in {
                  'desktop/README.md','webapp/package.json','webapp/index.html','webapp/vite.config.js',
                  'webapp/src/lib/storage.js','webapp/src/main.jsx','webapp/src/App.jsx','webapp/src/styles.css',
                  'webapp/README.md','README.md','.gitignore'
              }:
                  continue
              path=Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              content=textwrap.dedent(match.group(2))
              path.write_text(content,encoding='utf-8')
              written.append(raw_path)

          required={'desktop/README.md','webapp/package.json','webapp/index.html','webapp/vite.config.js','webapp/src/lib/storage.js','webapp/src/main.jsx','webapp/src/App.jsx','webapp/src/styles.css','webapp/README.md','README.md','.gitignore'}
          missing=required-set(written)
          if missing:
              raise SystemExit(f'Missing generated files: {sorted(missing)}')

          pkg=Path('webapp/package.json')
          data=json.loads(pkg.read_text(encoding='utf-8'))
          data['dependencies']={'react':'^19.1.1','react-dom':'^19.1.1'}
          data['devDependencies']={'@vitejs/plugin-react':'^5.0.2','vite':'^7.1.5'}
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          desktop_pkg=Path('desktop/package.json')
          data=json.loads(desktop_pkg.read_text(encoding='utf-8'))
          data['description']='Julo-ի համակարգչային տարբերակ՝ առաջադրանքների, նախագծերի և ժամանակի կառավարման համար'
          data['keywords']=['task-manager','project-management','todo','electron','time-tracking','julo']
          desktop_pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate web app
        working-directory: webapp
        run: |
          npm install
          npm run build

      - name: Validate desktop
        working-directory: desktop
        run: |
          npm ci
          npm run check
          npm test

      - name: Commit platform split
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "feat: split Julo into desktop and web apps"
          git push origin HEAD:main
