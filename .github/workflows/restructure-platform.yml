          cat > webapp/README.md <<'EOF'
          # Julo Web

          Julo Web-ը նախագծերի և առաջադրանքների կառավարման առանձին վեբ հավելված է։ Այն չի օգտագործում Desktop տարբերակի Electron/Planer legacy code-ը։

          ## Այս beta հիմքում կա

          - Kanban տախտակ՝ «Անելիք / Ընթացքում / Ավարտված» կարգավիճակներով
          - drag-and-drop կարգավիճակի փոփոխություն
          - նախագծեր և նախագծով ֆիլտրում
          - «Այսօր», «Բոլոր առաջադրանքները» և «Ավարտված» դիտումներ
          - որոնում
          - առաջնահերթություն, վերջնաժամկետ, պիտակներ և նկարագրություն
          - light/dark թեմա
          - local-first storage provider, որը հետագայում հնարավոր է փոխարինել API/cloud provider-ով
          - դատարկ workspace՝ առանց demo/legacy տվյալների

          ## Գործարկում

          ```bash
          npm install
          npm run dev
          ```

          ## Production build

          ```bash
          npm run build
          ```
          EOF

      - name: Create root project documentation and ignore rules
        run: |
          cat > README.md <<'EOF'
          # Julo

          Julo-ն աշխատանքի, նախագծերի և առաջադրանքների կառավարման հարթակ է։ Repository-ն բաժանված է երկու անկախ հավելվածի։

          ## `desktop/`

          Համակարգչային տարբերակ՝ Electron-ի հիմքով։ Այն պահպանում է ներկայիս Julo Desktop ֆունկցիոնալը և հին Planer տվյալների անվտանգ migration-ը։ Desktop տարբերակը այս փուլում ֆունկցիոնալորեն սառեցված է։

          ## `webapp/`

          Julo-ի նոր վեբ հավելվածը՝ նախատեսված նախագծերի և թիմային աշխատանքի ուղղությամբ զարգացնելու համար՝ Trello/Monday դասի աշխատանքային տրամաբանությամբ։ Այն կառուցված է առանձին և չի ժառանգում Planer-ի legacy UI/code-ը։

          Webapp-ը հիմա local-first է։ Հետագայում այստեղ կավելացվեն backend, հաշիվներ, թիմեր, permissions և cloud sync։

          ## Լեզու

          Julo-ի user-facing հիմնական լեզուն հայերենն է։ Legacy անունները կարող են պահպանվել միայն տեխնիկական migration-ի այն հատվածներում, որտեղ դրանց փոփոխությունը կարող է կոտրել հին տվյալների ներմուծումը։
          EOF

          cat > .gitignore <<'EOF'
          **/node_modules/
          **/dist/
          **/.DS_Store
          *.log
          .env
          .env.*
          !.env.example
          EOF

      - name: Install and validate web app
        working-directory: webapp
        run: |
          npm install
          npm run build

      - name: Validate desktop
        working-directory: desktop
        run: |
          npm ci
          npm run check
          npm test

      - name: Commit platform split
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "feat: split Julo into desktop and web apps"
            git push origin HEAD:main
          fi
