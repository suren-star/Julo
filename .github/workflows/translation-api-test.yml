name: Test translation endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/translation-api-test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test endpoints
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request
          q=urllib.parse.quote('Быстрое добавление задачи')
          urls=[
            f'https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=hy&dt=t&q={q}',
            f'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=ru&tl=hy&q={q}',
            f'https://api.mymemory.translated.net/get?q={q}&langpair=ru%7Chy',
          ]
          out=[]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read().decode('utf-8','replace')
              out.append(f'URL: {url.split("?")[0]}\nSTATUS: OK\nBODY: {body[:1000]}\n')
            except Exception as e:
              out.append(f'URL: {url.split("?")[0]}\nSTATUS: ERROR\nERROR: {type(e).__name__}: {e}\n')
          open('translation-api-test.txt','w',encoding='utf-8').write('\n'.join(out))
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f translation-api-test.txt
          git commit -m "chore: capture translation endpoint test"
          git push origin HEAD:main
